<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="109" height="48" viewBox="0 0 109 48" role="img" aria-label="Email">
<title>Email</title>
<style>
  .rise { opacity:0; animation: rise .9s cubic-bezier(.23,1,.32,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  .fade { opacity:0; animation: fade 1.2s ease forwards; }
  @keyframes fade { to { opacity:1; } }
  .blink { animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
    .rise, .fade { opacity:1; }
  }
</style>
