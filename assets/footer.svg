<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="the hunt is won before the strike. Abhishek Bhambhana, Upwork Growth Desk, Ahmedabad, India">
<title>the hunt is won before the strike. Abhishek Bhambhana, Upwork Growth Desk, Ahmedabad, India</title>
<style>
  .rise { opacity:0; animation: rise .9s cubic-bezier(.23,1,.32,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  .fade { opacity:0; animation: fade 1.2s ease forwards; }
  @keyframes fade { to { opacity:1; } }
  .blink { animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
    .rise, .fade { opacity:1; }
  }
.w { stroke-dasharray: 420; stroke-dashoffset: 420; animation: dw 1.8s cubic-bezier(.23,1,.32,1) .4s forwards; } @keyframes dw { to { stroke-dashoffset: 0; } }</style>
<text x="600" y="58" text-anchor="middle" font-family="'Instrument Serif', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#9fb6a8">the hunt is won before the strike.</text>
<path class="w" d="M400 84 C 540 98, 660 98, 800 82" fill="none" stroke="#caff45" stroke-width="2.2" stroke-linecap="round"/>
<text x="600" y="122" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.4" fill="#607768">ABHISHEK BHAMBHANA  ·  UPWORK GROWTH DESK  ·  AHMEDABAD, INDIA</text>
</svg>
