ospace" font-size="12" fill="#8A8A85">03</text><text x="537" y="158" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="500" fill="#0A0A0A">Interview</text><text x="537" y="184" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#5C5C58">Calls and follow ups,</text><text x="537" y="204" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#5C5C58">handled for you.</text></g><circle cx="776" cy="88" r="7" fill="#FFFFFF" stroke="#8A8A85"/><circle class="pop" style="animation-delay:1460ms" cx="776" cy="88" r="7" fill="#FF5A1F"/><g class="u" style="animation-delay:1460ms"><text x="769" y="132" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8A8A85">04</text><text x="769" y="158" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="500" fill="#0A0A0A">Close</text><text x="769" y="184" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#5C5C58">Scope and milestones</text><text x="769" y="204" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#5C5C58">agreed up front.</text></g><circle cx="1008" cy="88" r="7" fill="#FFFFFF" stroke="#8A8A85"/><circle class="pop" style="animation-delay:1780ms" cx="1008" cy="88" r="7" fill="#FF5A1F"/><g class="u" style="animation-delay:1780ms"><text x="1001" y="132" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8A8A85">05</text><text x="1001" y="158" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="500" fill="#0A0A0A">Protect Job Success</text><text x="1001" y="184" font-family="Geist, -apple-system, BlinkMacSyst