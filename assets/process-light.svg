<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="How an account wins at Upwork Growth Desk: score the job, write to one client, interview, close, protect Job Success">
<style>
.u{opacity:0;transform:translateY(14px);animation:up 900ms cubic-bezier(0.22,1,0.36,1) forwards}
