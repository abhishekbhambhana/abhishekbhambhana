<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="60" viewBox="0 0 1200 60" role="img" aria-label="07 Connect">
<title>07 Connect</title>
<style>
  .rise { opacity:0; animation: rise .9s cubic-bezier(.23,1,.32,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  .fade { opacity:0; animation: fade 1.2s ease forwards; }
  @keyframes fade { to { opacity:1; } }
  .blink { animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
    .rise, .fade { opacity:1; }
  }
.ln { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: ln 1.2s cubic-bezier(.23,1,.32,1) .2s forwards; } @keyframes ln { to { transform: scaleX(1); } }</style>
<text x="0" y="40" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#caff45">07</text>
<text x="46" y="42" font-family="'Inter Tight', 'Inter', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="750" font-size="28" letter-spacing="-.5" fill="#9fb6a8">Connect</text>
<line class="ln" x1="175" y1="32" x2="1200" y2="32" stroke="#294032"/>
</svg>
