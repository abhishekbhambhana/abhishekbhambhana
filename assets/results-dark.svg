<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="Go to market results across five startups: leads up 50%, sales cycles 30 to 45% shorter, one startup grew revenue 5x">
<style>
.u{opacity:0;transform:translateY(14px);animation:up 900ms cubic-bezier(0.22,1,0.36,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transform:none!important}}

.bar{transform-box:fill-box;transform-origin:0 50%;animation:bar 1100ms cubic-bezier(0.22,1,0.36,1) both}
@keyframes bar{from{transform:scaleX(0)}}
</style>
<rect x="0.5" y="0.5" width="1199" height="289" rx="16" fill="#1F1F1F" stroke="#313131"/>
<text class="u" x="48" y="48" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#76766F">Fractional head of sales, five startups, Dec 2024 to Mar 2025</text>
<text x="48" y="102" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="#F2F2EE">Leads</text><rect class="bar" style="animation-delay:300ms" x="290" y="86" width="397" height="8" rx="4" fill="#313131"/><rect class="bar" style="animation-delay:550ms" x="290" y="100" width="595" height="8" rx="4" fill="#CAFF45"/><text x="1152" y="102" text-anchor="end" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#F2F2EE">+50%</text><text x="48" y="158" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="#F2F2EE">Sales cycle</text><rect class="bar" style="animation-delay:450ms" x="290" y="142" width="576" height="8" rx="4" fill="#313131"/><rect class="bar" style="animation-delay:700ms" x="290" y="156" width="358" height="8" rx="4" fill="#CAFF45"/><text x="1152" y="158" text-anchor="end" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#F2F2EE">30 to 45% shorter</text><text x="48" y="214" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="#F2F2EE">Revenue, one startup</text><rect class="bar" style="animation-delay:600ms" x="290" y="198" width="122" height="8" rx="4" fill="#313131"/><rect class="bar" style="animation-delay:850ms" x="290" y="212" width="608" height="8" rx="4" fill="#CAFF45"/><text x="1152" y="214" text-anchor="end" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#F2F2EE">5x</text>
<rect x="48" y="250" width="10" height="10" rx="2" fill="#313131"/><text x="64" y="259" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#76766F">Before</text>
<rect x="120" y="250" width="10" height="10" rx="2" fill="#CAFF45"/><text x="136" y="259" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#76766F">After</text>
</svg>