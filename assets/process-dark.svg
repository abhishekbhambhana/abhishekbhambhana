ospace" font-size="12" fill="#76766F">03</text><text x="537" y="158" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="500" fill="#F2F2EE">Interview</text><text x="537" y="184" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#A3A39C">Calls and follow ups,</text><text x="537" y="204" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#A3A39C">handled for you.</text></g><circle cx="776" cy="88" r="7" fill="#1F1F1F" stroke="#76766F"/><circle class="pop" style="animation-delay:1460ms" cx="776" cy="88" r="7" fill="#FF6A33"/><g class="u" style="animation-delay:1460ms"><text x="769" y="132" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#76766F">04</text><text x="769" y="158" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="500" fill="#F2F2EE">Close</text><text x="769" y="184" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#A3A39C">Scope and milestones</text><text x="769" y="204" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#A3A39C">agreed up front.</text></g><circle cx="1008" cy="88" r="7" fill="#1F1F1F" stroke="#76766F"/><circle class="pop" style="animation-delay:1780ms" cx="1008" cy="88" r="7" fill="#FF6A33"/><g class="u" style="animation-delay:1780ms"><text x="1001" y="132" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#76766F">05</text><text x="1001" y="158" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="500" fill="#F2F2EE">Protect Job Success</text><text x="1001" y="184" font-family="Geist, -apple-system, BlinkMacSyst