<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="How an account wins at Upwork Growth Desk: score the job, write to one client, interview, close, protect Job Success">
<style>
.u{opacity:0;transform:translateY(14px);animation:up 900ms cubic-bezier(0.22,1,0.36,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transform:none!important}}

.fill{stroke-dasharray:928;stroke-dashoffset:928;animation:draw 1600ms cubic-bezier(0.77,0,0.175,1) 400ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0.4);opacity:0;animation:pop 500ms cubic-bezier(0.22,1,0.36,1) forwards}
@keyframes pop{to{transform:scale(1);opacity:1}}
.run{opacity:0;animation:run 5s cubic-bezier(0.65,0,0.35,1) 2.6s infinite}
@keyframes run{0%{transform:translateX(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(928px);opacity:0}}
