name: Metrics
on:
  schedule: [{cron: "30 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"], paths: [".github/workflows/metrics.yml"]}
concurrency: metrics
jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Scope-less token: reads public data plus anonymized private contribution counts only
    steps:
      - name: Contribution calendar (3D)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS }}
          filename: assets/metrics-calendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Overview
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          filename: assets/metrics-overview.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata

      - name: Achievements
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          filename: assets/metrics-achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes

      - name: Coding habits
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          filename: assets/metrics-habits.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph

      - name: Languages
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          filename: assets/metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage

      - name: Website PageSpeed
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          filename: assets/metrics-pagespeed.svg
          base: ""
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://abhishekbhambhana.github.io
          plugin_pagespeed_detailed: yes

      - name: Skyline (3D)
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          filename: assets/metrics-skyline.svg
          base: ""
          plugin_skyline: yes
          plugin_skyline_year: 2026
