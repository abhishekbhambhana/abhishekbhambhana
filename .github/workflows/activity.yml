name: Activity card
on:
  schedule: [{cron: "15 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"], paths: ["scripts/activity_card.py", ".github/workflows/activity.yml"]}
concurrency: activity
jobs:
  card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Scope-less token: reads the public contribution calendar (daily counts only)
      - run: python scripts/activity_card.py ${{ github.repository_owner }} assets
        env: {GH_TOKEN: "${{ secrets.METRICS }}"}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-*.svg
          git diff --cached --quiet || (git commit -m "Update activity card [skip ci]" && git push)
