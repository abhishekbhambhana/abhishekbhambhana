name: Snake
on:
  schedule: [{cron: "0 1 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"], paths: [".github/workflows/snake.yml"]}
concurrency: snake
jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0A0A0A&color_dots=#EDEDE7,#CFE2B6,#93BE74,#558F48,#2F6A3A
            dist/snake-dark.svg?color_snake=#F2F2EE&color_dots=#1E1D14,#3B4813,#6A8A1E,#9DC92C,#CAFF45
      - name: Publish to output branch
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cp dist/*.svg "$RUNNER_TEMP/out/" && cd "$RUNNER_TEMP/out"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Update snake"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
