name: Snake
on:
  schedule: [{cron: "0 1 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"], paths: [".github/workflows/snake.yml"]}
concurrency: snake
jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#131209&color_dots=#E6E6DF,#C9E7A0,#8FC25A,#4E8A3E,#2F6A3A
            dist/snake-dark.svg?color_snake=#F7F7F4&color_dots=#23221A,#3B4A12,#6B8A1E,#A3CC2E,#CAFF45
      - name: Publish to output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Update snake"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
